<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#00ADEF">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=New+Rocker&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="auth.js" defer></script>
    <title>Product Detail - Mock & Troll</title>
    <style>
        :root {
            --accent: #00ADEF;
            --accent-dark: #007BA8;
            --accent-shadow-30: rgba(0, 173, 239, 0.3);
            --accent-shadow-50: rgba(0, 173, 239, 0.5);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(180deg, #1a1a1a 0%, #000000 100%);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 3px solid var(--accent);
            box-shadow: 0 4px 20px var(--accent-shadow-30);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            font-size: 36px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 8px;
            text-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
            font-family: 'New Rocker', 'Impact', 'Arial Black', sans-serif;
        }

        .logo-tagline {
            font-size: 11px;
            color: var(--accent);
            letter-spacing: 3px;
            margin-top: -5px;
            font-weight: bold;
        }

        .nav-menu {
            display: flex;
            gap: 35px;
            list-style: none;
            align-items: center;
        }

        .nav-menu a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 900;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .nav-menu a:hover {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent);
        }

        .product-detail-container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 30px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 30px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .back-link:hover {
            text-shadow: 0 0 10px var(--accent);
        }

        .product-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: start;
        }

        .product-image-large {
            width: 100%;
            height: 600px;
            background: #0a0a0a;
            border: 2px solid #333;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info-detail {
            padding: 20px 0;
        }

        .band-name-detail {
            color: var(--accent);
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        .product-title-detail {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 20px;
            letter-spacing: 2px;
            line-height: 1.2;
        }

        .product-price-detail {
            font-size: 48px;
            color: var(--accent);
            font-weight: 900;
            margin-bottom: 30px;
        }

        .product-description {
            color: #bbb;
            line-height: 1.8;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .product-actions-detail {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
        }

        .buy-btn-detail {
            flex: 1;
            padding: 18px;
            background: var(--accent);
            border: none;
            color: white;
            font-weight: 900;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .buy-btn-detail:hover {
            background: var(--accent-dark);
            box-shadow: 0 5px 20px var(--accent-shadow-50);
        }

        .product-specs {
            border-top: 2px solid #333;
            padding-top: 30px;
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #333;
        }

        .spec-label {
            color: #999;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 12px;
        }

        .spec-value {
            color: #fff;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .product-detail-grid {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .product-image-large {
                height: 400px;
            }

            .product-title-detail {
                font-size: 32px;
            }

            .product-price-detail {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>

            <ul class="nav-menu">

        // Get product ID from URL
        function getProductId() {
            const urlParams = new URLSearchParams(window.location.search);
            return parseInt(urlParams.get('id')) || 0;
        }

        // Find product
        function findProduct(productId) {
            return products.find(p => p.id === productId);
        }

        // Add to cart
        function addToCart(productId) {
            try {
                if (!window.AuthSim || !window.AuthSim.getAuth()) {
                    alert('Please login to add items to cart.');
                    window.location.href = 'login.html';
                    return;
                }
            } catch (e) { }
            const product = findProduct(productId);
            if (!product) return;

            let cart = [];
            try {
                const cartData = localStorage.getItem('cart');
                if (cartData) {
                    cart = JSON.parse(cartData);
                }
            } catch (e) {
                cart = [];
            }

            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            try {
                localStorage.setItem('cart', JSON.stringify(cart));
                alert('Product added to cart!');
                window.location.href = 'index.html';
            } catch (e) {
                alert('Failed to add to cart. Please try again.');
            }
        }

        // Render product detail
        function renderProductDetail() {
            const productId = getProductId();
            const product = findProduct(productId);
            const container = document.getElementById('productDetail');

            if (!product) {
                container.innerHTML = '<div style="text-align: center; color: #999; padding: 40px;">Product not found. <a href="index.html" style="color: #00ADEF;">Go back</a></div>';
                return;
            }

            // Update page title
            document.title = `${product.name} - ${product.band} - Mock & Troll`;

            const categoryLabel = product.category.split(' ')[0].charAt(0).toUpperCase() + product.category.split(' ')[0].slice(1);

            container.innerHTML = `
                <div class="product-image-large" style="background: ${product.gradient};">
                    ${product.imageUrl ? `<img src="${product.imageUrl}" alt="${product.name}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\\'font-size: 120px;\\'>${product.icon}</span>'">` : `<span style="font-size: 120px;">${product.icon}</span>`}
                </div>
                
                <div class="product-info-detail">
                    <div class="band-name-detail">${product.band}</div>
                    <h1 class="product-title-detail">${product.name}</h1>
                    <div class="product-price-detail">฿${product.price.toLocaleString()}</div>
                    
                    <p class="product-description">
                        Official merchandise from ${product.band}. 
                        High-quality ${product.name} featuring authentic band designs. 
                        Perfect for fans and collectors.
                    </p>
                    
                    <div class="product-actions-detail">
                        <button class="buy-btn-detail" onclick="addToCart(${product.id})">ADD TO CART</button>
                    </div>
                    
                    <div class="product-specs">
                        <div class="spec-item">
                            <span class="spec-label">Band</span>
                            <span class="spec-value">${product.band}</span>
                        </div>
                        <div class="spec-item">
                            <span class="spec-label">Category</span>
                            <span class="spec-value">${categoryLabel}</span>
                        </div>
                        <div class="spec-item">
                            <span class="spec-label">Price</span>
                            <span class="spec-value">฿${product.price.toLocaleString()}</span>
                        </div>
                        <div class="spec-item">
                            <span class="spec-label">Shipping</span>
                            <span class="spec-value">Free over ฿1,500</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderProductDetail();
        });
    </script>
