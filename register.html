<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=New+Rocker&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <title>Register - Mock & Troll</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter','Segoe UI',Roboto,Arial,sans-serif; background:#0a0a0a; color:#fff; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
        .auth-container { background:#1a1a1a; border:3px solid #00ADEF; padding:40px; max-width: 520px; width:100%; box-shadow:0 0 30px rgba(0,173,239,.3); }
        .auth-container h1 { font-size:32px; margin-bottom:10px; text-transform:uppercase; letter-spacing:3px; color:#00ADEF; text-align:center; font-weight:900; }
        .auth-container p { text-align:center; color:#999; margin-bottom:30px; font-size:14px; }
        .form-grid { display:grid; gap:18px; }
        .form-group label { display:block; margin-bottom:8px; font-weight:600; text-transform:uppercase; letter-spacing:1px; font-size:12px; color:#00ADEF; }
        .form-group input { width:100%; padding:12px 14px; background:#0a0a0a; border:2px solid #333; color:#fff; outline:none; font-size:14px; transition:border-color .3s; font-family:inherit; }
        .form-group input:focus { border-color:#00ADEF; }
        .submit-btn { width:100%; padding:14px; background:#00ADEF; border:none; color:#fff; font-weight:900; letter-spacing:2px; cursor:pointer; text-transform:uppercase; font-size:14px; transition:all .3s; margin-top:10px; font-family:inherit; }
        .submit-btn:hover { background:#007BA8; box-shadow:0 5px 20px rgba(0,173,239,.5); }
        .error { background: rgba(196,30,58,.2); border:1px solid #c41e3a; color:#ff6b6b; padding:12px; margin-bottom:10px; text-align:center; font-size:14px; }
        .success { background: rgba(0,173,239,.2); border:1px solid #00ADEF; color:#00ADEF; padding:12px; margin-bottom:10px; text-align:center; font-size:14px; }
        .auth-links { text-align:center; margin-top:20px; color:#999; font-size:14px; }
        .auth-links a { color:#00ADEF; text-decoration:none; font-weight:600; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1>REGISTER</h1>
        <p>Create your account</p>

        <div class="error" data-error style="display:block; min-height: 0;"></div>
        <div class="success" data-success style="display:block; min-height: 0;"></div>

        <form data-register-form class="form-grid">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" id="full_name" name="full_name" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit" class="submit-btn">REGISTER</button>
        </form>

        <div class="auth-links">
            Already have an account? <a href="login.html">Login here</a>
        </div>
        <div class="auth-links" style="margin-top:10px;">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
